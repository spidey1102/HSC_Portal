name: Build macOS DMGs

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag containing the desktop packaging configuration
        required: true
        default: desktop/windows-app
        type: string
      release_tag:
        description: Existing GitHub Release tag that should receive the DMGs
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Build ${{ matrix.label }} DMG
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel (x64)
            runner: macos-26-intel
            architecture: x64
          - label: macOS Apple Silicon (arm64)
            runner: macos-26
            architecture: arm64

    steps:
      - name: Check out desktop source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: npx electron-builder --mac dmg --${{ matrix.architecture }}

      - name: Upload DMG to the selected release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release/*.dmg --clobber
